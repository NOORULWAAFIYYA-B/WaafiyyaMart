<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller - WaafiyyaMart</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #222; }
        header { background: #1f2937; color: white; padding: 18px 30px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        header h1 { margin: 0; font-size: 22px; }
        .container { width: 92%; max-width: 1200px; margin: 30px auto; }
        h2 { margin: 0 0 20px; }
        .card { background: white; padding: 25px; border-radius: 10px; margin-bottom: 25px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; min-width: 0; }
        .form-group.full { grid-column: 1 / -1; }
        label { margin-bottom: 6px; font-weight: bold; }
        input, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        input:focus, textarea:focus, button:focus-visible { outline: 3px solid rgba(37,99,235,.35); outline-offset: 2px; }
        textarea { min-height: 90px; resize: vertical; }
        button { border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        button:disabled { opacity: .65; cursor: wait; }
        .logout-btn, .cancel-btn { background: #6b7280; color: white; }
        .add-btn { background: #2563eb; color: white; margin-top: 18px; }
        .update-btn { background: #16a34a; color: white; margin-top: 18px; }
        .edit-btn { background: #f59e0b; color: white; margin-right: 6px; }
        .delete-btn { background: #dc2626; color: white; }
        .message { margin-top: 15px; padding: 10px; border-radius: 6px; }
        .message:empty { display: none; }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; vertical-align: middle; }
        th { background: #f3f4f6; }
        .actions { white-space: nowrap; }
        .hidden { display: none; }
        .image-help { margin: 6px 0 0; color: #555; font-size: .9rem; }
        .image-preview { display: block; width: 180px; height: 130px; margin-top: 10px; border-radius: 8px; object-fit: cover; background: #eef2f7; }
        .product-thumbnail { width: 72px; height: 60px; border-radius: 6px; object-fit: cover; background: #eef2f7; }
        @media (max-width: 700px) {
            header { padding: 16px; }
            .container { width: calc(100% - 24px); margin: 16px auto; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: auto; }
            .card { padding: 18px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>WaafiyyaMart - Seller Dashboard</h1>
        <button id="logoutBtn" class="logout-btn" type="button">Log out</button>
    </header>

    <main class="container">
        <section class="card">
            <h2>Add New Product</h2>
            <form id="addProductForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" required maxlength="160">
                    </div>
                    <div class="form-group">
                        <label for="productCategory">Category</label>
                        <input type="text" id="productCategory" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Price (₹)</label>
                        <input type="number" id="productPrice" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="productStock">Stock</label>
                        <input type="number" id="productStock" min="0" step="1" required>
                    </div>
                    <div class="form-group full">
                        <label for="productDescription">Description</label>
                        <textarea id="productDescription" required maxlength="2000"></textarea>
                    </div>
                    <div class="form-group full">
                        <label for="productImage">Product image (JPEG, PNG, or WebP; max 5 MB)</label>
                        <input type="file" id="productImage" accept="image/jpeg,image/png,image/webp" required aria-describedby="productImageHelp">
                        <p class="image-help" id="productImageHelp">Choose a clear product photo. Your image preview appears below before saving.</p>
                        <img class="image-preview" id="productImagePreview" src="/images/product-placeholder.svg" alt="Selected product image preview">
                    </div>
                </div>
                <button class="add-btn" id="addProductButton" type="submit">Add Product</button>
            </form>
            <p id="addMessage" class="message" role="status" aria-live="polite"></p>
        </section>

        <section class="card hidden" id="editCard">
            <h2>Edit Product</h2>
            <form id="editProductForm">
                <input type="hidden" id="editProductId">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="editProductName">Product Name</label>
                        <input type="text" id="editProductName" required maxlength="160">
                    </div>
                    <div class="form-group">
                        <label for="editProductCategory">Category</label>
                        <input type="text" id="editProductCategory" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="editProductPrice">Price (₹)</label>
                        <input type="number" id="editProductPrice" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="editProductStock">Stock</label>
                        <input type="number" id="editProductStock" min="0" step="1" required>
                    </div>
                    <div class="form-group full">
                        <label for="editProductDescription">Description</label>
                        <textarea id="editProductDescription" required maxlength="2000"></textarea>
                    </div>
                    <div class="form-group full">
                        <label for="editProductImage">Replace product image (optional; JPEG, PNG, or WebP; max 5 MB)</label>
                        <input type="file" id="editProductImage" accept="image/jpeg,image/png,image/webp" aria-describedby="editProductImageHelp">
                        <p class="image-help" id="editProductImageHelp">Leave this empty to keep the current product image.</p>
                        <img class="image-preview" id="editProductImagePreview" src="/images/product-placeholder.svg" alt="Current product image preview">
                    </div>
                </div>
                <button class="update-btn" id="updateProductButton" type="submit">Update Product</button>
                <button class="cancel-btn" id="cancelEditBtn" type="button">Cancel</button>
            </form>
            <p id="editMessage" class="message" role="status" aria-live="polite"></p>
        </section>

        <section class="card">
            <h2>Your Products</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Category</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody"></tbody>
                </table>
            </div>
            <p id="tableMessage" class="message" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="seller.js"></script>
</body>
</html>
